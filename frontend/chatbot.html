<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture - AI Assistant</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            display: flex;
            flex-direction: column;
            height: 75vh;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .chat-header {
            padding: 1.5rem;
            background: linear-gradient(135deg, #0891b2, #06b6d4);
            color: white;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .bot-avatar {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            background: #f8fafc;
        }
        .message {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: var(--radius-lg);
            font-size: 1rem;
            line-height: 1.5;
            position: relative;
            animation: messageSlide 0.3s ease-out;
        }
        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.bot {
            align-self: flex-start;
            background: white;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-bottom-left-radius: 0;
        }
        .message.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 0;
        }
        .chat-input-area {
            padding: 1.5rem;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
        }
        .chat-input {
            flex: 1;
            padding: 0.875rem 1.25rem;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: #f1f5f9;
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition-fast);
        }
        .chat-input:focus {
            outline: none;
            border-color: #06b6d4;
            background: white;
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.1);
        }
        .btn-send {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #06b6d4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: var(--transition-fast);
        }
        .btn-send:hover {
            background: #0891b2;
            transform: scale(1.05);
        }
        .suggestions {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            overflow-x: auto;
            background: white;
            border-top: 1px solid var(--border-color);
        }
        .suggestion-chip {
            white-space: nowrap;
            padding: 0.5rem 1rem;
            background: rgba(6, 182, 212, 0.08);
            color: #0891b2;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid rgba(6, 182, 212, 0.1);
            transition: var(--transition-fast);
        }
        .suggestion-chip:hover {
            background: #06b6d4;
            color: white;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 1rem 1.25rem;
            background: white;
            border-radius: var(--radius-lg);
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #cbd5e1;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="mesh-bg flex flex-col min-h-screen">
    <header class="navbar">
        <div class="container navbar-content">
            <a href="home.html" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Levels
            </a>
            <span class="logo mx-auto">Gesture</span>
            <div style="width: 70px;"></div>
        </div>
    </header>

    <main class="container page-content fade-in">
        <div class="chat-container">
            <div class="chat-header">
                <div class="bot-avatar">🤖</div>
                <div>
                    <h3 style="color: white; margin: 0;">Gesture Assistant</h3>
                    <p style="font-size: 0.8rem; opacity: 0.9; margin: 0;">Online | Ask me about ASL</p>
                </div>
            </div>

            <div id="chat-messages" class="chat-messages">
                <div class="message bot">
                    Hello! I'm your ASL Assistant. You can ask me anything about American Sign Language, Deaf culture, or how to use this app. What's on your mind?
                </div>
            </div>

            <div id="typing-indicator" class="typing-indicator hidden">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="suggestions" id="suggestions-box">
                <!-- Suggested questions will be injected here -->
            </div>

            <form id="chat-form" class="chat-input-area">
                <input type="text" id="user-input" class="chat-input" placeholder="Type your question here..." autocomplete="off">
                <button type="submit" class="btn-send">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </main>

    <script src="JS/chatbot.js"></script>
    <script src="JS/main.js"></script>
</body>
</html>
